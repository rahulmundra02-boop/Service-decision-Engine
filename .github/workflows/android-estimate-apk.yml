name: Android Estimate APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: android-estimate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.19.4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Auto increment Android version code
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'app.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          const current = Number(config.expo?.android?.versionCode || 0);
          if (!current) throw new Error('android.versionCode is missing in app.json');
          config.expo.android.versionCode = current + 1;
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          console.log('Android versionCode:', config.expo.android.versionCode);
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json
          git commit -m "Auto increment Android version code"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Read release version
        id: release_version
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          BUILD=$(node -p "require('./app.json').expo.android.versionCode")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm install

      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK with embedded JavaScript
        working-directory: android-estimate/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AL-Service-Estimate-release-apk
          path: android-estimate/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK release
        working-directory: android-estimate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="android-v${{ steps.release_version.outputs.version }}-build${{ steps.release_version.outputs.build }}"
          gh release create "$TAG" android/app/build/outputs/apk/release/app-release.apk \
            --repo "${{ github.repository }}" \
            --target "$(git rev-parse HEAD)" \
            --title "AL Service Estimate v${{ steps.release_version.outputs.version }} (Build ${{ steps.release_version.outputs.build }})" \
            --notes "Android Service Estimate APK release. Build ${{ steps.release_version.outputs.build }}." \
            --latest
