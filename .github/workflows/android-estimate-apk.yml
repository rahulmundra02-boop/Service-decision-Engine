name: Android Estimate APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-estimate-beta
      - android-estimate-commit
    paths:
      - "android-estimate/**"
      - "api/save-history.js"
      - ".github/workflows/android-estimate-apk.yml"

concurrency:
  group: android-estimate-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: android-estimate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.19.4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Read release version
        id: release_version
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          BUILD=$(node -p "require('./app.json').expo.android.versionCode")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm install

      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK with embedded JavaScript
        working-directory: android-estimate/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AL-Service-Estimate-release-apk
          path: android-estimate/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish public mobile update files
        if: github.ref_name == 'android-estimate-beta'
        run: |
          rm -rf ../stable-publish
          git fetch origin master
          git worktree add ../stable-publish origin/master
          mkdir -p ../stable-publish/public/mobile
          cp android/app/build/outputs/apk/release/app-release.apk ../stable-publish/public/mobile/AL-Service-Estimate-latest.apk
          cat > ../stable-publish/public/mobile/latest.json <<EOF
          {
            "version": "${{ steps.release_version.outputs.version }}",
            "build": ${{ steps.release_version.outputs.build }},
            "downloadUrl": "https://service-decision-engine.vercel.app/mobile/AL-Service-Estimate-latest.apk"
          }
          EOF
          cd ../stable-publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/mobile/AL-Service-Estimate-latest.apk public/mobile/latest.json
          git commit -m "Publish Android build ${{ steps.release_version.outputs.build }}" || echo "No public mobile update changes"
          git push origin HEAD:master
      - name: Publish APK release
        if: github.ref_name == 'android-estimate-beta'
        working-directory: android-estimate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="android-v${{ steps.release_version.outputs.version }}-build${{ steps.release_version.outputs.build }}"
          cat > latest.json <<EOF
          {
            "version": "${{ steps.release_version.outputs.version }}",
            "build": ${{ steps.release_version.outputs.build }},
            "downloadUrl": "https://github.com/${{ github.repository }}/releases/latest/download/AL-Service-Estimate-release.apk"
          }
          EOF
          gh release create "$TAG" android/app/build/outputs/apk/release/app-release.apk latest.json             --repo "${{ github.repository }}"             --target "$(git rev-parse HEAD)"             --title "AL Service Estimate v${{ steps.release_version.outputs.version }} (Build ${{ steps.release_version.outputs.build }})"             --notes "Android Service Estimate APK release. Build ${{ steps.release_version.outputs.build }}."             --latest

      - name: Publish beta APK files for in-app updater
        if: github.ref_name == 'android-estimate-commit'
        run: |
          rm -rf ../beta-publish
          git fetch origin master
          git worktree add ../beta-publish origin/master
          mkdir -p ../beta-publish/public/mobile/beta
          cp android/app/build/outputs/apk/release/app-release.apk ../beta-publish/public/mobile/beta/AL-Service-Estimate-Beta-latest.apk
          cat > ../beta-publish/public/mobile/beta/latest.json <<EOF
          {
            "version": "${{ steps.release_version.outputs.version }}",
            "build": ${{ steps.release_version.outputs.build }},
            "downloadUrl": "https://service-decision-engine.vercel.app/mobile/beta/AL-Service-Estimate-Beta-latest.apk"
          }
          EOF
          cd ../beta-publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/mobile/beta/AL-Service-Estimate-Beta-latest.apk public/mobile/beta/latest.json
          git commit -m "Publish Beta Android build ${{ steps.release_version.outputs.build }}" || echo "No beta public mobile update changes"
          git push origin HEAD:master

      - name: Publish beta APK prerelease
        if: github.ref_name == 'android-estimate-commit'
        working-directory: android-estimate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG="android-beta-v${{ steps.release_version.outputs.version }}-build${{ steps.release_version.outputs.build }}-$SHORT_SHA"
          gh release create "$TAG" android/app/build/outputs/apk/release/app-release.apk \
            --repo "${{ github.repository }}" \
            --target "$(git rev-parse HEAD)" \
            --title "AL Service Estimate Beta v${{ steps.release_version.outputs.version }} (Build ${{ steps.release_version.outputs.build }})" \
            --notes "Beta Android Service Estimate APK. Commit $SHORT_SHA." \
            --prerelease

