name: Beta Job Card Cache Refresh

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  refresh-beta-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Beta cache refresh
        env:
          CACHE_CRON_SECRET: ${{ secrets.BETA_CACHE_CRON_SECRET }}
        run: |
          if [ -z "$CACHE_CRON_SECRET" ]; then
            echo "::error::Repository secret BETA_CACHE_CRON_SECRET is not configured."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 10 \
            -X POST \
            -H "Authorization: Bearer $CACHE_CRON_SECRET" \
            "https://service-decision-engine-git-v12-ui-testing-service-decision.vercel.app/api/cron-job-card-cache"
